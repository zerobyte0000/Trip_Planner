<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Our Travel Community</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            font-family: 'Ubuntu', sans-serif; /* A modern, geometric sans-serif */
            background: linear-gradient(150deg, #8bc34a, #cddc39); /* Fresh green gradient */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.9); /* Slightly transparent white */
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #558b2f; /* A deep green */
            font-size: 2.8em;
            margin-bottom: 30px;
            letter-spacing: 1px;
            position: relative;
            display: inline-block;
        }
        h1::before {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -6px;
            width: 50px;
            height: 3px;
            background-color: #8bc34a; /* A brighter green */
            transform: translateX(-50%);
            border-radius: 2px;
        }
        .error {
            color: #d32f2f; /* Red error text */
            background-color: #ffebee; /* Light red background */
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #ef9a9a;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
            text-align: left;
        }
        input[type="text"],
        input[type="password"] {
            width: calc(100% - 22px);
            padding: 12px;
            border: 1px solid #c8e6c9; /* Light green border */
            border-radius: 6px;
            font-size: 1em;
            margin-bottom: 20px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #558b2f;
            outline: none;
            box-shadow: 0 0 8px rgba(85, 139, 47, 0.2);
        }
        input[type="submit"] {
            background-color: #558b2f; /* Deep green submit button */
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }
        input[type="submit"]:hover {
            background-color: #33691e; /* Darker green */
            transform: translateY(-2px);
        }
        p {
            font-size: 1em;
            margin-top: 20px;
        }
        p a {
            color: #558b2f; /* Deep green link */
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }
        p a:hover {
            color: #33691e; /* Darker green hover */
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/ns5R+E6ztJQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-user-plus"></i> Join the Adventure!</h1>
        {% if error %}
        <p class="error"><i class="fas fa-exclamation-circle"></i> {{ error }}</p>
        {% endif %}
        <form method="POST">
            <label for="username"><i class="fas fa-user"></i> Username:</label><br>
            <input type="text" id="username" name="username" placeholder="Choose your username" required><br><br>
            <label for="password"><i class="fas fa-lock"></i> Password:</label><br>
            <input type="password" id="password" name="password" placeholder="Create a strong password" required><br><br>
            <input type="submit" value="Sign Up" ><i class="fas fa-arrow-right"></i>
        </form>
        <p>Already have an account? <a href="{{ url_for('login') }}">Log In <i class="fas fa-sign-in-alt"></i></a></p>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/js/all.min.js" integrity="sha512-rPf6CbuxS3fJZPdjYOBFnY0boCnoeZHGv4tINyFc1KtJHntbOEWAh00rsohXBj0kWBnowx7JVpeDlRXxcF+h6g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>
</html>
