<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Back!</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #64b5f6, #e3f2fd);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #1e88e5;
            font-size: 2.8em;
            margin-bottom: 30px;
            letter-spacing: 1px;
            position: relative;
            display: inline-block;
        }
        h1::before {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -6px;
            width: 50px;
            height: 3px;
            background-color: #42a5f5;
            transform: translateX(-50%);
            border-radius: 2px;
        }
        .error {
            color: #d32f2f;
            background-color: #ffebee;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #ef9a9a;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
            text-align: left;
        }
        input[type="text"],
        input[type="password"] {
            width: calc(100% - 22px);
            padding: 12px;
            border: 1px solid #bbdefb;
            border-radius: 6px;
            font-size: 1em;
            margin-bottom: 20px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #1e88e5;
            outline: none;
            box-shadow: 0 0 8px rgba(30, 136, 229, 0.2);
        }
        input[type="submit"] {
            background-color: #1e88e5;
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }
        input[type="submit"]:hover {
            background-color: #1565c0;
            transform: translateY(-2px);
        }
        p {
            font-size: 1em;
            margin-top: 20px;
        }
        p a {
            color: #1e88e5;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }
        p a:hover {
            color: #1565c0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sign In</h1>
        {% if error %}
        <p class="error"><i class="fas fa-exclamation-circle"></i> {{ error }}</p>
        {% endif %}
        <form method="POST">
            <label for="username"><i class="fas fa-user"></i> Username:</label><br>
            <input type="text" id="username" name="username" placeholder="Your Username" required><br><br>
            <label for="password"><i class="fas fa-lock"></i> Password:</label><br>
            <input type="password" id="password" name="password" placeholder="Your Password" required><br><br>
            <input type="submit" value="Log In">
        </form>
        <p>Don't have an account? <a href="{{ url_for('signin') }}">Sign Up <i class="fas fa-arrow-right"></i></a></p>
    </div>
    <script src="https://kit.fontawesome.com/your_fontawesome_kit.js" crossorigin="anonymous"></script>
</body>
</html>
